<!doctype html>
<html lang="hu">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Új fagyi hozzáadása</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header class="border-bottom bg-white">
        <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html#fooldal">FagyizóDB</a>

                <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#foMenu" aria-controls="foMenu" aria-expanded="false" aria-label="Menü">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse d-lg-flex flex-grow-0 ms-auto" id="foMenu">

                    <div class="d-none d-lg-flex gap-2">
                        <a class="btn btn-outline-info" href="index.html#fooldal">Főoldal</a>
                        <a class="btn btn-outline-info" href="index.html#lekerdezes">Lekérdezés</a>
                        <a class="btn btn-outline-info" href="index.html#statisztika">Statisztika</a>
                        <a class="btn btn-info text-white" href="add-fagyi.html">Új fagyi</a>
                    </div>

                    <div class="d-lg-none pt-3 d-grid gap-2">
                        <a class="btn btn-outline-info" href="index.html#fooldal">Főoldal</a>
                        <a class="btn btn-outline-info" href="index.html#lekerdezes">Lekérdezés</a>
                        <a class="btn btn-outline-info" href="index.html#statisztika">Statisztika</a>
                        <a class="btn btn-info text-white" href="add-fagyi.html">Új fagyi</a>
                    </div>

                </div>

            </div>
        </nav>
    </header>

    <main class="py-5" style="margin-top: 70px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                <h1 class="fw-bold">Új fagyi hozzáadása</h1>
                                <p class="text-muted mb-0">Töltsd ki az alábbi űrlapot az új fagylalt rögzítéséhez</p>
                            </div>

                            <form id="fagyiUrlap">
                                <div class="mb-3">
                                    <label for="fagyiNev" class="form-label fw-semibold">Fagyi neve</label>
                                    <input type="text" class="form-control form-control-lg" id="fagyiNev"
                                        name="fagyiNev" required>
                                </div>

                                <div class="mb-3">
                                    <label for="fagyiTipus" class="form-label fw-semibold">Típus</label>
                                    <select class="form-select form-select-lg" id="fagyiTipus" name="fagyiTipus"
                                        required>
                                        <option value="">Válassz típust</option>
                                        <option value="gyumolcsos">Gyümölcsös</option>
                                        <option value="csokis">Csokis</option>
                                        <option value="tejes">Tejes</option>
                                        <option value="kulonleges">Különleges</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="fagyiAr" class="form-label fw-semibold">Ár</label>
                                    <input type="number" class="form-control form-control-lg" id="fagyiAr"
                                        name="fagyiAr" required>
                                </div>

                                <div class="mb-3">
                                    <label for="fagyiLeiras" class="form-label fw-semibold">Leírás</label>
                                    <textarea class="form-control" id="fagyiLeiras" name="fagyiLeiras"
                                        rows="4"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="fagyiElerheto" class="form-label fw-semibold">Elérhetőség</label>
                                    <select class="form-select form-select-lg" id="fagyiElerheto"
                                        name="fagyiElerheto" required>
                                        <option value="">Válassz...</option>
                                        <option value="igen">Elérhető</option>
                                        <option value="nem">Nem elérhető</option>
                                    </select>
                                </div>

                                <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mt-4">
                                    <button type="submit" class="btn btn-info btn-lg text-white px-5">
                                        Hozzáadás
                                    </button>
                                    <a href="index.html#lekerdezes" class="btn btn-outline-secondary btn-lg px-5">
                                        Vissza
                                    </a>
                                </div>
                            </form>

                            <div id="uzenet" class="mt-4 text-center"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3">
        <div class="container text-center">
            <small class="text-muted">
                © 2026 Álom-Édes Fagylalt - Admin felület
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
